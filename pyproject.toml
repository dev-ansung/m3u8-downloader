[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3u8dl"
version = "0.1.0"
description = "Download HLS m3u8 streams to MP4"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "m3u8>=3.5",
    "pycryptodome>=3.19",
    "tqdm>=4.66",
]

[project.scripts]
m3u8dl = "m3u8_downloader.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m3u8_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "requests-mock>=1.12.1",
]
